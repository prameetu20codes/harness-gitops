server {
    listen 80;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Cross-namespace call: web-dev -> api-dev via cluster DNS
    location /api/ {
        proxy_pass http://api.api-dev.svc.cluster.local:80/;
        proxy_set_header Host $host;
    }
}
